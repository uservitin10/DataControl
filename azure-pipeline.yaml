trigger:
  branches:
    include:
      - master
      - release/*

variables:
  - group: nome-repo-common
  - ${{ if or(eq(variables['Build.SourceBranchName'], 'master'), contains(variables['Build.SourceBranch'], 'refs/tags/')) }}:
    - group: nome-repo-prod
  - ${{ elseif contains(variables['Build.SourceBranch'], 'release/') }}:
    - group: nome-repo-hom
  - ${{ else }}:
    - group: nome-repo-dev

resources:
  repositories:
  - repository: templates
    type: git
    name: DevOps/template-pipelines
    ref: 'refs/heads/master'

extends:
  template: /node/azure-pipeline.yaml@templates
  parameters:
    IS_USING_YARN: false